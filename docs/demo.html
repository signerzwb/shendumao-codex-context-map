<body>
<main class="app">
  <header class="toolbar">
    <div class="brand"><span class="mark" aria-hidden="true">⑂</span><span class="brand-copy"><strong id="brand-name">神都猫脉络</strong><small id="map-title">思路地图</small></span><span class="stat" id="stats"></span></div>
    <nav class="tools" aria-label="地图工具">
      <span class="save-state" id="save-state"></span>
      <button id="add-node" type="button">加节点</button>
      <button id="direction" type="button">横向</button>
      <button id="fit" type="button">全图</button>
      <button id="display-mode" type="button">展开</button>
      <select id="theme" aria-label="风格"><option value="light">雾白</option><option value="dark">墨黑</option><option value="ocean">深海</option><option value="paper">暖纸</option></select>
      <button id="export" type="button">导出</button>
      <button id="language" type="button">EN</button>
    </nav>
  </header>
  <section class="viewport" id="viewport" aria-label="可拖动缩放的思路地图">
    <div class="world" id="world"></div>
    <div class="empty" id="empty">正在等待地图数据…</div>
    <aside class="inspector" id="inspector" hidden></aside>
    <div class="context-menu" id="context-menu" hidden>
      <button type="button" data-menu-action="edit">编辑节点</button>
      <button type="button" data-menu-action="add">在后面加节点</button>
      <button type="button" class="danger" data-menu-action="delete">删除节点</button>
    </div>
    <div class="controls"><button id="zoom-out" type="button" aria-label="缩小">−</button><output id="zoom-label">100%</output><button id="zoom-in" type="button" aria-label="放大">＋</button><button id="fit-bottom" type="button">全图</button></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>
</main>
<dialog id="node-dialog">
  <form class="dialog-form" id="node-form">
    <h2 id="node-dialog-title">编辑节点</h2>
    <p id="node-dialog-help">第一行作为标题，其余内容作为说明。Codex 仍可理解这段自然语言。</p>
    <textarea id="node-content" maxlength="1400" required></textarea>
    <div class="dialog-actions"><button type="button" id="node-cancel">取消</button><button type="submit" class="primary" id="node-submit">保存</button></div>
  </form>
</dialog>
<dialog id="delete-dialog">
  <form class="dialog-form" id="delete-form">
    <h2 id="delete-dialog-title">删除这个节点？</h2>
    <p id="delete-dialog-help">会保存为一个新版本，旧版本仍可回看。</p>
    <div class="dialog-actions"><button type="button" id="delete-cancel">取消</button><button type="submit" class="primary" id="delete-submit">删除</button></div>
  </form>
</dialog>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme");
  const direction = params.get("direction");
  if (["light", "dark", "ocean", "paper"].includes(theme) || ["vertical", "horizontal"].includes(direction)) {
    sessionStorage.setItem("shendumao-context-map-view", JSON.stringify({
      theme: ["light", "dark", "ocean", "paper"].includes(theme) ? theme : "light",
      direction: direction === "horizontal" ? "horizontal" : "vertical",
      language: "zh",
    }));
  }
  addEventListener("load", () => {
    const focus = params.get("focus");
    if (focus) setTimeout(() => {
      const node = [...document.querySelectorAll("[data-node-id]")].find((item) => item.dataset.nodeId === focus);
      node?.click();
    }, 100);
  });
})();
</script>
